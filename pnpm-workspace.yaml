packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  sharp: true

# Fetch Linux and macOS native binaries regardless of host, so the ssh app can cross-compile.
supportedArchitectures:
  os: [current, linux, darwin]
  cpu: [current, x64, arm64]
  libc: [current, glibc]

catalog:
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0
  react: ^19.3.0
  react-dom: ^19.3.0
  typescript: ^5.9.3
